<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>💕 双人大富翁</title>
  <style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(160deg, #ffe3ec 0%, #e7f0ff 100%);
  color: #2b2b3a;
  min-height: 100vh;
}
.hidden { display: none !important; }
.screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }

.card {
  background: #fff; border-radius: 20px; padding: 24px;
  width: 100%; max-width: 420px; box-shadow: 0 12px 40px rgba(0,0,0,.12);
  text-align: center;
}
h1 { margin: 0 0 4px; font-size: 26px; }
h2 { margin: 0 0 12px; }
.sub { color: #888; margin: 6px 0 18px; font-size: 14px; }
label { display: block; text-align: left; font-size: 13px; color: #666; margin: 14px 0 6px; }
input {
  width: 100%; padding: 12px 14px; border: 1.5px solid #e3e3ef; border-radius: 12px;
  font-size: 16px; outline: none;
}
input:focus { border-color: #ff5e7e; }

button {
  font-size: 16px; border: none; border-radius: 12px; padding: 12px 18px;
  cursor: pointer; transition: transform .08s, opacity .2s; font-weight: 600;
}
button:active { transform: scale(.96); }
.primary { background: #ff5e7e; color: #fff; }
.ghost { background: #eef0f6; color: #555; }
.big { padding: 16px; font-size: 18px; width: 100%; }
.divider { color: #aaa; margin: 18px 0 6px; font-size: 13px; }
.join-row { display: flex; gap: 8px; }
.join-row input { text-transform: uppercase; }
.join-row button { background: #3b82f6; color: #fff; white-space: nowrap; }

.themes { display: flex; gap: 10px; }
.theme-btn { flex: 1; background: #f1f2f8; color: #555; border: 2px solid transparent; }
.theme-btn.active { background: #fff0f4; border-color: #ff5e7e; color: #ff5e7e; }
.mode-btn { flex: 1; background: #f1f2f8; color: #555; border: 2px solid transparent; font-size: 13px; padding: 10px 4px; }
.mode-btn.active { background: #eaf6ff; border-color: #3b82f6; color: #3b82f6; }

.msg { color: #e23; font-size: 13px; min-height: 18px; margin-top: 12px; }
.code {
  font-size: 34px; letter-spacing: 6px; font-weight: 800; color: #ff5e7e;
  background: #fff0f4; border-radius: 14px; padding: 14px; margin: 14px 0;
}
.players-mini { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }

/* ===== 游戏界面 ===== */
#game { display: block; padding: 10px; max-width: 560px; margin: 0 auto; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.room { font-size: 14px; color: #666; }
.room b { color: #ff5e7e; letter-spacing: 2px; }
.turn { font-size: 14px; font-weight: 700; color: #3b82f6; }

.players { display: flex; gap: 10px; margin-bottom: 10px; }
.pbox {
  flex: 1; background: #fff; border-radius: 14px; padding: 10px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
  border: 2px solid transparent;
}
.pbox.active { border-color: #ffd23f; }
.pbox .pname { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.pbox .pmoney { font-size: 20px; font-weight: 800; margin-top: 2px; }
.pbox .pinfo { font-size: 12px; color: #888; margin-top: 2px; }
.pbox.broke { opacity: .5; }

/* 棋盘 */
.board {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px;
}
.tile {
  background: #fff; border-radius: 10px; padding: 6px 4px; min-height: 52px;
  font-size: 11px; text-align: center; position: relative; box-shadow: 0 2px 6px rgba(0,0,0,.06);
  display: flex; flex-direction: column; justify-content: space-between;
}
.tile .tname { font-weight: 600; line-height: 1.2; }
.tile .ttype { font-size: 9px; color: #aaa; }
.tile .owner-bar { height: 4px; border-radius: 2px; margin-top: 3px; }
.tile .lv { font-size: 9px; color: #ff5e7e; font-weight: 700; }
.tile .tokens { position: absolute; top: 2px; right: 3px; font-size: 11px; }
.tile.property { border-left: 4px solid #ffd23f; }
.tile.go { background: #fff7e6; }
.tile.jail, .tile.gotojail { background: #ffe9e9; }
.tile.park { background: #e9fff0; }
.tile.tax { background: #fff0e9; }
.tile.chance { background: #e9f3ff; }
.tile.destiny { background: #f3e9ff; }

.event {
  background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; text-align: center;
  font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.08); animation: pop .2s;
}
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.controls { margin-bottom: 10px; }
.buybox { display: flex; gap: 8px; }
.buybox button { flex: 1; }

.logwrap, .chatwrap { background: #fff; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.log { max-height: 160px; overflow-y: auto; text-align: left; font-size: 12px; color: #555; margin-top: 8px; }
.log div { padding: 2px 0; border-bottom: 1px solid #f0f0f5; }
.chatlog { max-height: 140px; overflow-y: auto; text-align: left; font-size: 13px; margin: 8px 0; }
.chatlog div { margin: 4px 0; }
.chatrow { display: flex; gap: 6px; }
.chatrow input { flex: 1; }
.chatrow button { background: #3b82f6; color: #fff; }

#over .card h1 { font-size: 30px; }

/* 小游戏弹层 */
.minigame { background:#fff; border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:0 4px 14px rgba(0,0,0,.08); }
.mgtitle { font-weight:800; font-size:16px; text-align:center; margin-bottom:6px; }
.mgsub { text-align:center; font-size:14px; color:#555; margin:6px 0; }
.rps-row { display:flex; gap:10px; justify-content:center; }
.rps-btn { font-size:30px; width:64px; height:64px; border-radius:16px; background:#fff0f4; }
.quiz-opts { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
.quiz-opts button { background:#f1f2f8; color:#333; text-align:left; }

/* 遮罩 */
.overlay { position:fixed; inset:0; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  </style>
</head>
<body>
  <!-- 登录/建房界面 -->
  <div id="lobby" class="screen">
    <div class="card">
      <h1>💕 双人大富翁</h1>
      <p class="sub">异地也能一起玩的小游戏</p>

      <label>你的昵称</label>
      <input id="name" maxlength="8" placeholder="例如：宝贝 / 我" />

      <label>选择地图主题</label>
      <div class="themes">
        <button class="theme-btn active" data-theme="city">🏙️ 城市冒险</button>
        <button class="theme-btn" data-theme="campus">🎓 校园时光</button>
      </div>

      <label>选择玩法模式</label>
      <div class="themes">
        <button class="mode-btn active" data-mode="classic">⚔️ 经典对战</button>
        <button class="mode-btn" data-mode="race">🏁 竞速</button>
        <button class="mode-btn" data-mode="coop">🤝 合作</button>
      </div>

      <button id="createBtn" class="primary">创建房间</button>
      <div class="divider">— 或 —</div>
      <label>输入房间号加入</label>
      <div class="join-row">
        <input id="joinCode" maxlength="6" placeholder="6位房间号" />
        <button id="joinBtn">加入</button>
      </div>
      <p id="lobbyMsg" class="msg"></p>
    </div>
  </div>

  <!-- 等待界面 -->
  <div id="waiting" class="screen hidden">
    <div class="card">
      <h2>房间已创建</h2>
      <p>把房间号发给对方，TA 输入即可加入：</p>
      <div id="roomCode" class="code">------</div>
      <p class="sub">等待对方加入中…</p>
      <div id="waitPlayers" class="players-mini"></div>
    </div>
  </div>

  <!-- 游戏界面 -->
  <div id="game" class="screen hidden">
    <div class="topbar">
      <div class="room">房间 <b id="gCode">----</b></div>
      <div id="turnInfo" class="turn"></div>
    </div>

    <div class="players">
      <div id="p0" class="pbox"></div>
      <div id="p1" class="pbox"></div>
    </div>

    <div id="board" class="board"></div>

    <div id="event" class="event hidden"></div>

    <!-- 小游戏弹层 -->
    <div id="miniGame" class="minigame hidden">
      <div id="rpsBox" class="mgbox hidden">
        <div class="mgtitle">🎮 石头剪刀布</div>
        <div id="rpsStatus" class="mgsub"></div>
        <div class="rps-row">
          <button class="rps-btn" data-rps="rock">✊</button>
          <button class="rps-btn" data-rps="paper">✋</button>
          <button class="rps-btn" data-rps="scissors">✌️</button>
        </div>
        <div id="rpsResult" class="mgsub"></div>
      </div>
      <div id="quizBox" class="mgbox hidden">
        <div class="mgtitle">🧠 答题挑战</div>
        <div id="quizQ" class="mgsub"></div>
        <div id="quizOpts" class="quiz-opts"></div>
        <div id="quizResult" class="mgsub"></div>
      </div>
    </div>

    <div class="controls">
      <button id="rollBtn" class="primary big">🎲 掷骰子</button>
      <div id="buyBox" class="buybox hidden">
        <button id="buyYes" class="primary">买下 (花费 <span id="buyPrice"></span>)</button>
        <button id="buyNo" class="ghost">放弃</button>
      </div>
      <div id="jailBox" class="buybox hidden">
        <button id="jailPay" class="primary">交保释金50出狱</button>
        <button id="jailWait" class="ghost">再关一回合</button>
      </div>
    </div>

    <details class="logwrap">
      <summary>📜 游戏记录</summary>
      <div id="log" class="log"></div>
    </details>

    <details class="chatwrap">
      <summary>💬 悄悄话</summary>
      <div id="chatLog" class="chatlog"></div>
      <div class="chatrow">
        <input id="chatInput" placeholder="说点什么…" />
        <button id="chatSend">发送</button>
      </div>
    </details>
  </div>

  <!-- 结算界面 -->
  <div id="over" class="screen hidden">
    <div class="card">
      <h1 id="winText">🎉</h1>
      <button id="againBtn" class="primary">再来一局</button>
    </div>
  </div>

  <!-- 重连提示遮罩 -->
  <div id="overlay" class="overlay hidden">
    <div class="card">
      <h2 id="overlayTitle">正在重连…</h2>
      <p id="overlayMsg" class="sub"></p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
